# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: FreeSynergy-Net/fs-release/.github/workflows/check.yml@b71b39f61ffc812bb93e2dcf906ecf0bbb44bb2a
    with:
      # Software Vulkan (lavapipe) and the fonts the width tests measure with (input of the shared check workflow, fs-release v0.0.4)
      software-gpu: true

  # B-L step 3: the text gate (every visible text in de and en, no hard coded UI text) as a WARNING only: the findings
  # of the old tables are not fixed yet (step 6). The self test of the script itself is hard. Step 7 removes the
  # continue-on-error and the --warn.
  texts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self test of the gate (hard)
        run: python3 -I contract/texts-check --selftest
      - name: Texts gate (warning)
        continue-on-error: true
        run: python3 -I contract/texts-check . --warn

  # K4: the core of the board builds without the forms adapter (feature `form` off): no channel name, no direct dependency on fs-components-core (transitively it still arrives).
  kanban-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Kanban core without the forms adapter
        run: cargo check -p fs-components-kanban --no-default-features --locked
