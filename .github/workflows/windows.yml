# Small Windows gate: the Blinc-free command model (menus, shortcuts, dispatcher) and the settings library `fs-settings`
# (file locks, atomic replace, XDG places: review L2) and the block catalogue `fs-components-catalog` (pure data, no Blinc) are built, linted and tested on the Windows
# runner, because it names Ctrl/Cmd/Alt keys per platform. The Blinc crates are not built here (no GPU on the runner).
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@485f74732ddb90965fafcfa37b6a4f6b473dcc6b
        with:
          components: clippy
          cache-key: windows
      - run: cargo clippy -p fs-components-commands --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test -p fs-components-commands --all-features --locked --no-fail-fast
        timeout-minutes: 15
      - run: cargo clippy -p fs-settings --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test -p fs-settings --all-features --locked --no-fail-fast
        timeout-minutes: 15
      - run: cargo clippy -p fs-components-catalog --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test -p fs-components-catalog --all-features --locked --no-fail-fast
        timeout-minutes: 15
