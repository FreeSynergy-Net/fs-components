# Small Windows gate: the Blinc-free command model (menus, shortcuts, dispatcher) and the settings library `fs-settings`
# (file locks, atomic replace, XDG places: review L2) and the block catalogue `fs-components-catalog` (pure data, no Blinc) are built, linted and tested on the Windows
# runner, because it names Ctrl/Cmd/Alt keys per platform. The Blinc crates are not built here (no GPU on the runner).
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@b71b39f61ffc812bb93e2dcf906ecf0bbb44bb2a
        with:
          components: clippy
          cache-key: windows
      # cargo-nextest: the same prebuilt install as actions/gates of fs-release (taiki-e/install-action, pinned by SHA, version = scripts/nextest.pin of fs-release; no compile)
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151
      # profile as in check.yml: tag -> release, every other ref -> quick (.config/nextest.toml). No doc tests here: none of these crates has one (nextest does not run them).
      # `quick` leaves the platform tests (sockets, files, stamps: the reason this runner exists) out; on a branch each run is followed by the same selection with profile `platform` (same features = same build), on a tag `release` runs everything
      - name: nextest profile
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "PROFILE=release" >> "$GITHUB_ENV"; else echo "PROFILE=quick" >> "$GITHUB_ENV"; fi
      - run: cargo clippy -p fs-components-commands --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-components-commands --all-features --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-components-commands --all-features --locked; fi
        timeout-minutes: 15
      - run: cargo clippy -p fs-settings --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-settings --all-features --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-settings --all-features --locked; fi
        timeout-minutes: 15
      - run: cargo clippy -p fs-components-catalog --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-components-catalog --all-features --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-components-catalog --all-features --locked; fi
        timeout-minutes: 15
      - run: cargo clippy -p fs-components-mf2 --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-components-mf2 --all-features --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-components-mf2 --all-features --locked; fi
        timeout-minutes: 15
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-components-mf2 --no-default-features --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-components-mf2 --no-default-features --locked; fi
        timeout-minutes: 15
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-components-editor --features syntect --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-components-editor --features syntect --locked; fi
        timeout-minutes: 15
      - shell: bash
        run: |
          cargo nextest run --profile ${{ env.PROFILE }} --no-fail-fast --no-tests=pass -p fs-components-replay --locked
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then cargo nextest run --profile platform --no-fail-fast --no-tests=pass -p fs-components-replay --locked; fi
        timeout-minutes: 15
