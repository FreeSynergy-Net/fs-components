# The theme contract of fs-components (ADR 0074, step 1). Derived from the code of v0.0.12; the version is of the contract.
[contract]
version = "0.5.0"
status = "draft"
adr = "0074"
derived_from = "fs-components v0.0.12; 0.4 adds `accepts` (what a block takes: slots) and `renders` (which field a block draws) to every block, see crates/fs-components-catalog; 0.2 adds the blocks of fs-components 0.0.23 (dialogs, toast, switch, segmented, skeleton, partial-notice)"
# `accepts = []` on a block means: no slot declared yet (frames, and blocks whose data slots are not written down yet); the first
# slots are those of `board`, `board-detail`, `form-field`, `menubar`, `toolbar`. `renders` only where a block draws a field: `field-text`, `field-email`, `field-name`, `field-phone`, `field-address`, `field-date` (blocks/fields.toml) and `person-picker`.
# Slot names (key `accepts`): kebab case `[a-z][a-z0-9-]{0,31}`, no `--`, no trailing `-`. The limit of 32 is a format limit of this
# file (technical, by=technical): a slot name is part of element ids and message keys. `repeat` is a whole number from 1 (a `u32`);
# there is NO ceiling of ours: it is what one description may list. How many field values a card or a detail frame takes at
# run time is a SETTING of the instance (by=default: 4 facts, 32 elements), not a number of this file.
# Files that hold the contract, relative to this directory. All of them are TOML and are read in file name order.
block_files = ["blocks/*.toml"]
mapping_files = ["mapping/*.toml"]
exception_file = "exceptions.toml"
# A name with one of these prefixes anywhere in the source counts as a class or id name (besides `.class("..")`/`.id("..")`).
prefixes = ["fs-", "craft-", "cn-"]

# Standard states: every block takes the ones that fit from this list (ARIA states first) and names its own beside them.
[vocabulary]
# `unsupported` = the program does not do it yet (ADR 0066, ADR 0096 H-K5): drawn like `disabled` (same size, weak), the reason "not finished yet" is a tooltip (`fs-components-overlays::disabled::wrap`); not allowed is no state, it is not delivered.
states = ["default", "hover", "focus", "cursor", "pressed", "selected", "current", "checked", "expanded", "collapsed",
          "disabled", "unsupported", "busy", "invalid", "required", "readonly", "open", "editing", "locked", "hidden", "invisible", "withheld"]

# Attributes (ENTSCHEID-zeichnen M2, M10, A5b). Names follow CSS Sizing 3, Box Alignment 3, Flexbox, FHIR Questionnaire, HTML. All lengths are
# logical px (`lpx`) or `em`. A block lists the ones it reads (output only, measured) and sets (the layout or the person may change; a frame
# also puts its own parameters here: `axis`, `sizes`, `active`). What a layout sets that is not in `sets` of the block is shown, never dropped silently.
# `states`: `locked` (right x mode), `hidden` (gone, no room), `invisible` (keeps its room, no click, no focus), `withheld` (value exists, not shown to this person).
# Frame `groups` and `align_longest` come with A10, not here.
reads = ["max-content-width", "max-content-height", "min-content-width", "baseline", "bounds", "content-size", "part-size"]
sets = ["width", "height", "min-width", "max-width", "min-height", "max-height", "grow", "shrink", "align", "size-group",
        "opacity", "prefix", "suffix", "placeholder", "order", "hidden", "axis", "sizes", "active"]
