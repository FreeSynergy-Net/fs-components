# General blocks: every program uses them. Names are WAI-ARIA roles (naming = "aria"), Open UI names (naming = "open-ui") or
# our own with a reason (naming = "own"). For aria and open-ui the block name is the role or component name.

[block.button]
accepts = []
naming = "aria"
ref = "button"
scope = "general"
summary = "A pressable control. Variants carry the look (primary, outline, icon ...), states carry the situation."
summary_de = "Ein drückbares Bedienelement. Varianten tragen das Aussehen (primary, outline, icon ...), Zustände die Lage."
parts = ["icon", "label"]
states = ["hover", "focus", "cursor", "pressed", "disabled", "busy"]
variants = ["primary", "secondary", "outline", "ghost", "link", "destructive", "small", "icon", "fill", "line"]

[block.textbox]
accepts = []
naming = "aria"
ref = "textbox"
scope = "general"
summary = "A line or area of editable text with its label, hint and suggestions (Open UI: Text Input)."
summary_de = "Eine Zeile oder Fläche für Text mit Beschriftung, Hinweis und Vorschlägen (Open UI: Text Input)."
parts = ["root", "label", "input", "display", "hint", "error", "suggestion"]
states = ["focus", "disabled", "readonly", "invalid", "required"]
variants = ["compact", "multiline"]

[block.searchbox]
accepts = []
naming = "aria"
ref = "searchbox"
scope = "general"
summary = "A text box that filters or finds; the one search field of every program."
summary_de = "Ein Textfeld, das filtert oder sucht; das eine Suchfeld jedes Programms."
parts = ["root", "input", "icon", "clear"]
states = ["focus", "busy", "disabled"]

[block.checkbox]
accepts = []
naming = "aria"
ref = "checkbox"
scope = "general"
summary = "A two-state choice (on, off) with a label; also the round done mark of a task."
summary_de = "Eine Ja-Nein-Wahl mit Beschriftung; auch der runde Erledigt-Haken einer Aufgabe."
parts = ["box", "mark", "label"]
states = ["checked", "hover", "focus", "disabled"]

[block.link]
accepts = []
naming = "aria"
ref = "link"
scope = "general"
summary = "Text that goes somewhere (a page, a project), with an optional arrow."
summary_de = "Text, der irgendwohin führt (Seite, Projekt), mit optionalem Pfeil."
parts = ["label", "arrow"]
states = ["hover", "focus", "visited", "disabled"]

[block.menubar]
accepts = [
  { slot = "entries", kind = "command", repeat = 16 },
]
naming = "aria"
ref = "menubar"
scope = "general"
summary = "The bar of menus of a window (File, Edit ...); each trigger opens a panel."
summary_de = "Die Menüleiste eines Fensters (Datei, Bearbeiten ...); jeder Auslöser öffnet ein Panel."
parts = ["root", "trigger", "panel", "item"]
states = ["open", "hover", "focus"]

[block.menu]
accepts = []
naming = "aria"
ref = "menu"
scope = "general"
summary = "A list of commands that opens from a menubar or a button; the entries are menu items."
summary_de = "Eine Liste von Befehlen, die aus einer Menüleiste oder einem Knopf aufgeht; die Einträge sind Menüeinträge."
parts = ["root", "item", "separator"]
states = ["open", "hover", "focus", "current", "disabled"]

[block.tab]
accepts = []
naming = "aria"
ref = "tab"
scope = "general"
summary = "One tab of a tab list (a file tab, a view switch, a filter chip that switches)."
summary_de = "Ein Reiter einer Reiterleiste (Datei-Reiter, Ansichtswechsel, Filter, der umschaltet)."
parts = ["root", "label", "close"]
states = ["selected", "hover", "focus", "current", "disabled"]

[block.tablist]
accepts = []
naming = "aria"
ref = "tablist"
scope = "general"
summary = "The row of tabs and what belongs to it (the panel is shown by the frontend)."
summary_de = "Die Reihe der Reiter samt Zubehör (das Panel zeigt das Frontend)."
parts = ["root", "row", "panel"]
states = ["default", "busy", "focus"]
variants = ["vertical"]

[block.tree]
accepts = []
forms = ["tree@^1.0.0"]
naming = "aria"
ref = "tree"
scope = "general"
summary = "A hierarchy of items that open and close (folders, pages); the items are tree items."
summary_de = "Eine Hierarchie aus Einträgen, die auf- und zuklappen (Ordner, Seiten); die Einträge sind Baumeinträge."
parts = ["root", "item", "toggle", "icon", "label"]
states = ["expanded", "collapsed", "selected", "focus", "current", "busy"]

[block.grid]
accepts = []
forms = ["rows@^1.0.0"]
naming = "aria"
ref = "grid"
scope = "general"
summary = "Rows and columns the person moves through with keys: the list view with head, rows and cells."
summary_de = "Zeilen und Spalten, durch die man mit Tasten geht: die Listenansicht mit Kopf, Zeilen und Zellen."
parts = ["root", "head", "row", "cell", "mark", "edge", "empty", "failed"]
states = ["selected", "hover", "focus", "current", "busy"]
variants = ["sortable"]

[block.table]
accepts = []
forms = ["rows@^1.0.0"]
naming = "aria"
ref = "table"
scope = "general"
summary = "Static rows and columns for reading (a table in a text, a table of packages)."
summary_de = "Feste Zeilen und Spalten zum Lesen (Tabelle im Text, Tabelle von Paketen)."
parts = ["root", "caption", "head", "row", "cell", "rowhead"]
states = ["hover", "selected"]

[block.toolbar]
accepts = [
  { slot = "actions", kind = "command", repeat = 8 },
]
naming = "aria"
ref = "toolbar"
scope = "general"
summary = "A bar of controls above a surface: search, actions, the room between them."
summary_de = "Eine Leiste mit Bedienelementen über einer Fläche: Suche, Aktionen, Platz dazwischen."
parts = ["root", "row", "group", "cell", "search", "action", "separator"]
states = ["default", "busy", "focus", "on", "current", "disabled"]
variants = ["vertical"]

[block.status]
accepts = []
naming = "aria"
ref = "status"
scope = "general"
summary = "The status line of a window with its more-panel: what the program does now and what went wrong."
summary_de = "Die Statuszeile eines Fensters mit Detail-Panel: was das Programm gerade tut und was schiefging."
parts = ["root", "line", "more", "panel", "text", "problem"]
states = ["busy", "open", "invalid"]

[block.alert]
accepts = []
naming = "aria"
ref = "alert"
scope = "general"
summary = "A message the person must see: failed, warning, notice. Severity is the variant."
summary_de = "Eine Meldung, die man sehen muss: Fehler, Warnung, Hinweis. Die Schwere ist die Variante."
parts = ["root", "icon", "title", "text", "action"]
states = ["default", "hover", "focus", "actionable"]
variants = ["error", "warning", "info", "ok"]

[block.note]
accepts = []
naming = "aria"
ref = "note"
scope = "general"
summary = "Quiet explanatory text beside content (a hint, a footnote); tone is the variant."
summary_de = "Leiser Erklärtext neben dem Inhalt (Hinweis, Fußnote); der Ton ist die Variante."
parts = ["root", "text"]
states = ["default"]
variants = ["info", "ok", "warning", "error", "quiet", "dim"]

[block.progressbar]
accepts = []
naming = "aria"
ref = "progressbar"
scope = "general"
summary = "How far something is: a track and a bar, optional label."
summary_de = "Wie weit etwas ist: Spur und Balken, optional Beschriftung."
parts = ["root", "track", "bar", "label"]
states = ["busy", "complete", "failed"]

[block.dialog]
accepts = []
naming = "aria"
ref = "dialog"
scope = "general"
summary = "A window above the window that asks or shows one thing and is closed again."
summary_de = "Ein Fenster über dem Fenster, das eines fragt oder zeigt und wieder geschlossen wird."
parts = ["root", "backdrop", "title", "body", "footer", "close"]
states = ["open", "busy", "danger"]

[block.card]
accepts = []
naming = "open-ui"
ref = "card"
scope = "general"
summary = "A framed area that holds one thing (a program, a task, a panel). Rich cards are their own blocks."
summary_de = "Eine umrahmte Fläche für eine Sache (Programm, Aufgabe, Panel). Reiche Karten sind eigene Bausteine."
parts = ["root", "header", "title", "body", "footer", "badge", "actions"]
states = ["hover", "selected", "busy", "disabled"]
variants = ["panel", "shared-lines"]

[block.tag]
accepts = []
naming = "open-ui"
ref = "tag"
scope = "general"
summary = "A small labelled pill: a filter, a label of a task, a mark. Tone is the variant."
summary_de = "Eine kleine beschriftete Pille: Filter, Aufgaben-Label, Markierung. Der Ton ist die Variante."
parts = ["root", "label", "close"]
states = ["default", "selected", "hover", "disabled"]
variants = ["neutral", "accent", "success", "warning", "danger"]

[block.badge]
accepts = []
naming = "open-ui"
ref = "badge"
scope = "general"
summary = "A short status or count on another block (installed, update, a dot)."
summary_de = "Ein kurzer Status oder eine Zahl an einem anderen Baustein (installiert, Update, Punkt)."
parts = ["root", "label", "dot"]
states = ["default"]
variants = ["info", "success", "warning", "error", "accent"]

[block.avatar]
accepts = []
naming = "open-ui"
ref = "avatar"
scope = "general"
summary = "A picture or the initials of a person or program."
summary_de = "Ein Bild oder die Initialen einer Person oder eines Programms."
parts = ["root", "image", "initials"]
states = ["default", "online", "away", "offline"]
variants = ["small", "large", "color-0", "color-1", "color-2", "color-3", "color-4", "color-5", "color-6"]

[block.breadcrumb]
accepts = []
naming = "open-ui"
ref = "breadcrumb"
scope = "general"
summary = "The path to where you are, each step a link, the last one is the place itself."
summary_de = "Der Weg bis hierher, jeder Schritt ein Link, der letzte ist der Ort selbst."
parts = ["root", "item", "separator", "current"]
states = ["hover", "focus", "current"]

[block.text]
accepts = []
naming = "open-ui"
ref = "text"
scope = "general"
summary = "Type styles of running text and labels (capitals, mono, dim); the variant is the style."
summary_de = "Schriftstile für Fließtext und Beschriftungen (Versalien, Mono, gedimmt); die Variante ist der Stil."
parts = ["run"]
states = ["default"]
variants = ["caps", "caps-dim", "mono", "sub", "quiet", "ok", "warning", "info", "error", "title", "strong"]

[block.alertdialog]
accepts = []
naming = "aria"
ref = "alertdialog"
scope = "general"
summary = "A dialog that interrupts with a message and wants an answer: role alertdialog, the keyboard starts on the least destructive button, Escape leaves."
summary_de = "Ein Dialog, der mit einer Meldung unterbricht und eine Antwort will: Rolle alertdialog, die Tastatur beginnt beim harmlosesten Knopf, Escape verlässt ihn."
parts = ["root", "title", "body", "footer"]
states = ["default", "danger"]

[block.tooltip]
accepts = []
naming = "aria"
ref = "tooltip"
scope = "general"
summary = "A small text that names or explains a control, shown on hover after a delay or at once on keyboard focus; Escape closes it."
summary_de = "Ein kleiner Text, der ein Bedienelement benennt oder erklärt, beim Überfahren nach einer Verzögerung, bei Tastaturfokus sofort gezeigt; Escape schließt ihn."
parts = ["host", "slot", "root"]
states = ["default", "open"]

[block.popover]
accepts = []
naming = "own"
reason = "Open UI calls it popup and the APG has no popover pattern; GNOME HIG names it Popover, and this one adds the close mark and the return of the keyboard to the trigger."
scope = "general"
summary = "A small panel next to its trigger with a little content; Escape or the close mark closes it and the keyboard returns to the trigger."
summary_de = "Ein kleines Feld neben seinem Auslöser mit wenig Inhalt; Escape oder das Schließen-Zeichen schließt es und die Tastatur kehrt zum Auslöser zurück."
parts = ["host", "root", "head", "close"]
states = ["default", "open", "hover", "focus"]

[block.banner]
accepts = []
naming = "own"
reason = "ARIA `banner` is the landmark of the page header; the bar with one message across the top of a window (GNOME HIG: Banner) has no ARIA name, its role is status or alert by the step."
scope = "general"
summary = "A bar across the top of a window or page with one message, an optional action and a dismiss mark; the step is the variant."
summary_de = "Eine Leiste über einem Fenster oder einer Seite mit einer Meldung, einer optionalen Aktion und einem Ausblenden-Zeichen; die Stufe ist die Variante."
parts = ["root", "icon", "text", "action", "close"]
states = ["default", "hover", "focus"]
variants = ["info", "ok", "warning", "error"]

[block.drop-zone]
accepts = []
naming = "own"
reason = "Neither ARIA nor Open UI names an area that takes dragged files; GNOME HIG asks for a way that needs no dragging, which this one carries: a button with the same end."
scope = "general"
summary = "An area that takes dragged files and has a keyboard way to the same end (Enter or Space opens the file chooser)."
summary_de = "Eine Fläche, die gezogene Dateien annimmt und einen Tastaturweg zum selben Ziel hat (Eingabe oder Leertaste öffnet die Dateiauswahl)."
parts = ["root", "text"]
states = ["default", "hover", "focus", "over"]

[block.context-menu]
accepts = []
naming = "own"
reason = "ARIA names the panel `menu`, which the block `menu` already is; the HIG name is Context menu and it adds the triggers (right click, Menu key, Shift+F10) and the two stages."
scope = "general"
summary = "The menu that opens at the pointer or at the selection for what is selected; role menu, lines are menu items."
summary_de = "Das Menü, das am Zeiger oder an der Auswahl für das Ausgewählte aufgeht; Rolle menu, die Zeilen sind menuitem."
parts = ["root", "item", "submenu"]
states = ["default", "hover", "focus", "disabled", "open"]

[block.disclosure]
accepts = []
naming = "open-ui"
ref = "disclosure"
scope = "general"
summary = "A header that shows or hides what belongs to it (a button with aria-expanded and aria-controls)."
summary_de = "Eine Kopfzeile, die zeigt oder verbirgt, was zu ihr gehört (ein Knopf mit aria-expanded und aria-controls)."
parts = ["root", "header", "mark", "title", "panel"]
states = ["open", "hover", "focus", "disabled"]

[block.accordion]
accepts = []
naming = "open-ui"
ref = "accordion"
scope = "general"
summary = "A stack of disclosures; each header is a heading with a button, the panel is a region named by it."
summary_de = "Ein Stapel von Aufklappern; jede Kopfzeile ist eine Überschrift mit Knopf, das Panel ist eine Region, die sie benennt."
parts = ["root", "heading", "header", "mark", "title", "panel"]
states = ["open", "hover", "focus", "disabled"]

[block.landmark]
accepts = []
naming = "own"
reason = "ARIA names eight region roles (banner, navigation, main, complementary, contentinfo, search, form, region); the block is the one element that carries any of them with its name, and the rule that region and form need a name."
scope = "general"
summary = "A region of a page a screen reader can jump to: role and name."
summary_de = "Ein Bereich einer Seite, zu dem ein Screenreader springen kann: Rolle und Name."
parts = ["root"]
states = ["default"]

[block.listbox]
accepts = []
naming = "aria"
ref = "listbox"
scope = "general"
summary = "A list of options to pick from, one or several; the options are option items, the list is one tab stop."
summary_de = "Eine Liste von Optionen zum Auswählen, eine oder mehrere; die Einträge sind Optionen, die Liste ist ein Tabstopp."
parts = ["root", "option", "label"]
states = ["selected", "hover", "focus", "current", "disabled"]

[block.treegrid]
accepts = []
naming = "aria"
ref = "treegrid"
scope = "general"
summary = "A grid whose rows open and close; the rows and cells are those of grid, a parent row carries a triangle."
summary_de = "Ein Raster, dessen Zeilen auf- und zuklappen; Zeilen und Zellen sind die des Rasters, eine Elternzeile trägt ein Dreieck."
parts = ["root", "mark"]
states = ["expanded", "collapsed"]

[block.feed]
accepts = []
naming = "aria"
ref = "feed"
scope = "general"
summary = "Articles one after the other that go on and on; each article has a title, a body and its place in the whole."
summary_de = "Beiträge hintereinander, die weitergehen; jeder Beitrag hat Titel, Inhalt und seinen Platz im Ganzen."
parts = ["root", "article", "title", "body"]
states = ["current", "focus", "busy"]

[block.slider]
accepts = []
naming = "open-ui"
ref = "slider"
scope = "general"
summary = "One value on a scale, set with the keys or the pointer; the thumb is the slider (value, minimum, maximum, words)."
summary_de = "Ein Wert auf einer Skala, mit Tasten oder Zeiger gesetzt; der Griff ist der Slider (Wert, Minimum, Maximum, Worte)."
parts = ["root", "track", "rail", "fill", "thumb", "keys", "value"]
states = ["hover", "focus", "active"]

[block.range]
accepts = []
naming = "own"
reason = "ARIA calls each thumb of a multi-thumb slider a slider; the pair of a low and a high thumb on one scale (a price range) has no name of its own in ARIA or Open UI, and its limits follow each other."
scope = "general"
summary = "Two values on one scale, each with its own thumb; the low thumb never passes the high one."
summary_de = "Zwei Werte auf einer Skala, jeder mit eigenem Griff; der untere Griff geht nie über den oberen."
parts = ["root"]
states = ["default"]

[block.meter]
accepts = []
naming = "aria"
ref = "meter"
scope = "general"
summary = "A value inside a known range with zones that say whether it is good (a disk that is 70 percent full)."
summary_de = "Ein Wert in einem bekannten Bereich mit Zonen, die sagen, ob er gut ist (eine Platte, die zu 70 Prozent voll ist)."
parts = ["root", "track", "fill", "text"]
states = ["good", "fair", "poor"]

[block.splitter]
accepts = []
naming = "own"
reason = "The APG names the pattern window splitter and ARIA the divider `separator`; the block is the divider with the two panes it moves, and HTML has no element for it."
scope = "general"
summary = "A movable divider between two panes (window splitter): a focusable separator with the size of the first pane."
summary_de = "Ein verschiebbarer Teiler zwischen zwei Bereichen (Window Splitter): ein fokussierbarer Separator mit der Größe des ersten Bereichs."
parts = ["root", "pane", "bar"]
states = ["hover", "focus", "active"]
variants = ["horizontal"]

[block.help]
accepts = []
naming = "own"
reason = "ARIA has no help pattern and Open UI no help component; GNOME HIG names it Help. This one reads the entry through the contract and ALWAYS says something: an entry with content or a visible fallback (ADR 0097)."
scope = "general"
summary = "The help of a window for one topic: the text of the entry, a note when it is shown in another language or is older than its original, or a visible sentence and the way to the documentation when there is no entry."
summary_de = "Die Hilfe eines Fensters zu einem Thema: der Text des Eintrags, ein Hinweis, wenn er in einer anderen Sprache gezeigt wird oder älter ist als das Original, oder ein sichtbarer Satz und der Weg zur Dokumentation, wenn es keinen Eintrag gibt."
parts = ["root", "text", "note", "action"]
states = ["default"]
variants = ["found", "missing", "unavailable"]

[block.carousel]
accepts = []
naming = "open-ui"
ref = "carousel"
scope = "general"
summary = "Slides one at a time with previous and next buttons and the position; a region with a slide group, no automatic rotation."
summary_de = "Folien nacheinander mit Zurück- und Weiter-Knopf und der Position; eine Region mit Folien-Gruppe, ohne automatisches Weiterschalten."
parts = ["root", "bar", "button", "position", "slide"]
states = ["hover", "focus"]

[block.chip]
accepts = []
naming = "own"
reason = "Open UI names a label Tag and a count Badge; a small label that can be removed (a keyword, a person of a share) has no name in ARIA or Open UI, and its row is a list with its own keys."
scope = "general"
summary = "A row of small removable labels; Delete or Backspace removes the one under the cursor."
summary_de = "Eine Reihe kleiner entfernbarer Beschriftungen; Entf oder Rückschritt entfernt die unter dem Cursor."
parts = ["root", "item", "label", "remove"]
states = ["current", "hover", "focus"]

[block.checklist]
accepts = []
naming = "own"
reason = "ARIA names the parts (group, checkbox); a list of things to tick off that the person adds to, removes from and puts in order has no name in ARIA or Open UI."
scope = "general"
summary = "A list of items to tick off, with a line to add one; Delete removes, Alt+Up and Alt+Down put an item in another place."
summary_de = "Eine Liste von Einträgen zum Abhaken mit einer Zeile zum Hinzufügen; Entf entfernt, Alt+Hoch und Alt+Runter setzen einen Eintrag um."
parts = ["root", "item", "box", "text", "remove", "input"]
states = ["done", "current", "hover", "focus"]
