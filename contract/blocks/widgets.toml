# Block-specific blocks: one widget or crate of fs-components each (naming = "own", reason given). Scope block.

[block.avatar-group]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (Open UI has Avatar only)."
scope = "block"
widget = "AvatarGroup"
summary = "A row of avatars with a +N circle for the rest."
summary_de = "Eine Reihe von Avataren mit einem +N-Kreis f\u00fcr den Rest."
parts = ["root", "avatar", "overflow"]
states = ["online", "away", "offline"]

[block.person-face]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); Open UI has Avatar, but the size is free here (a face in a list row and a big one on a page) and an unloadable picture is never drawn."
scope = "block"
widget = "PersonFace"
summary = "The round picture of a person, or a circle with the initials when there is none."
summary_de = "Das runde Bild einer Person oder ein Kreis mit den Initialen, wenn es keins gibt."
parts = ["root"]
states = ["default"]

[block.field-card]
accepts = []
forms = ["rows@^1.0.0"]
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (a labelled value with a symbol and actions)."
scope = "block"
widget = "FieldCard"
summary = "One field as a rounded card: symbol at the left, label and value, actions at the right (write a mail, copy)."
summary_de = "Ein Feld als abgerundete Karte: Symbol links, Bezeichnung und Wert, Aktionen rechts (Mail schreiben, kopieren)."
parts = ["root", "body", "label", "value", "actions", "action"]
states = ["hover", "focus"]
sizing = "content"
reads = ["max-content-width", "max-content-height", "min-content-width", "baseline", "part-size"]
sets = ["width", "min-width", "max-width", "align", "size-group", "prefix", "suffix", "order", "opacity", "hidden"]
defaults = {}

[block.head-bar]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); ARIA toolbar has no title slot and no round symbol buttons."
scope = "block"
widget = "HeadBar"
summary = "The bar on top of an area: buttons at both ends and a title between them."
summary_de = "Die Leiste über einem Bereich: Knöpfe an beiden Enden und ein Titel dazwischen."
parts = ["root", "left", "title", "right", "button"]
states = ["hover", "focus", "on"]

[block.contact-row]
accepts = []
forms = ["rows@^1.0.0"]
naming = "own"
reason = "Our own shape of the people workbench (DESIGN.md); ARIA option is the role, but the row (face, name, check circle) and the list around it are ours."
scope = "block"
widget = "PeopleWidget"
summary = "One person in the list of contacts: a round face and the name, a check circle while choosing."
summary_de = "Eine Person in der Kontaktliste: ein rundes Gesicht und der Name, beim Auswählen ein Haken-Kreis."
parts = ["root", "face", "name", "check", "list"]
states = ["selected", "marked", "hover", "focus"]
sizing = "content"
reads = ["max-content-width", "max-content-height", "baseline"]
sets = ["width", "min-width", "max-width", "align", "order", "opacity", "hidden"]
defaults = {}

[block.agent-tree]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (closest ARIA role: tree)."
scope = "block"
widget = "AgentTree"
summary = "The tree of agents and their steps, each row with name, state and what it needs from the person."
summary_de = "Der Baum der Agenten und ihrer Schritte, jede Zeile mit Name, Zustand und dem, was sie von der Person braucht."
parts = ["root", "row", "head", "head-text", "main", "name", "state", "meta", "summary", "toggle", "below", "empty"]
states = ["expanded", "collapsed", "question", "failed", "delivered"]

[block.calendar-grid]
accepts = [
  { slot = "items", kind = "records", required = true },
  { slot = "start", kind = "value", basic = ["dateTime", "date"], role = "display", within = "items", required = true },
  { slot = "end", kind = "value", basic = ["dateTime", "date"], role = "display", within = "items", required = true },
  { slot = "label", kind = "value", basic = ["text"], role = "display", within = "items", required = true },
  { slot = "all-day", kind = "value", basic = ["flag"], role = "compact", within = "items" },
  { slot = "lane", kind = "value", basic = ["text"], role = "compact", within = "items" },
  { slot = "activate", kind = "command", within = "items" },
  { slot = "menu", kind = "command", within = "items", repeat = 8 },
  { slot = "drop", kind = "command", within = "items", args = ["start", "end", "lane"] },
  { slot = "quick-add", kind = "command", args = ["label", "start", "end", "all-day"] },
  { slot = "color", kind = "value", basic = ["text"], role = "compact", within = "items" },
]
forms = ["bars-in-time@^1.1.0"]
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (a time grid of slots)."
scope = "block"
widget = "CalendarGrid"
summary = "The time grid of the calendar: month cells, timed slots, all-day row, the now line, and the agenda as a list by day (place option `view=month|week|day|agenda`, the first day of the week from the language or `view.week-start=mon..sun`); the week number at the start of a week row; variant compact = the small month with a mark under days with items. The item colour is the content colour of `color` (RFC 8984 section 4.2.11), drawn as given (the style decides only the tint of the ground, the ink for 4.5:1 and a quiet look without colour); below 3:1 on the ground an outline and a notice (ADR 0074 section 9)."
summary_de = "Das Zeitraster des Kalenders: Monatszellen, Zeitfenster, Ganztagszeile, die Jetzt-Linie und die Agenda als Liste je Tag (Platz-Option `view=month|week|day|agenda`, Wochenbeginn aus der Sprache oder `view.week-start=mon..sun`); die Wochennummer am Anfang einer Wochenzeile; Variante compact = der kleine Monat mit einem Punkt unter Tagen mit Terminen."
parts = ["root", "toolbar", "month", "timed", "allday", "slot", "now", "week-number", "mark", "agenda"]
states = ["default", "selected"]
variants = ["compact"]

[block.file-tile]
accepts = []
forms = ["tiles@^1.1.0"]
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (Open UI File is an upload control)."
scope = "block"
widget = "FileTile"
summary = "One file or folder as a tile with icon, name and a line of facts."
summary_de = "Eine Datei oder ein Ordner als Kachel mit Symbol, Name und einer Zeile Angaben."
parts = ["root", "icon", "name", "line", "badge", "mark", "marks", "plain", "grid", "empty"]
states = ["selected", "hover", "focus", "cursor"]

[block.file-chooser]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); the system dialog is the portal's, so only the button and the marked path-field fallback are ours; neither ARIA nor Open UI has a component of this shape."
scope = "block"
widget = "FilePickButton"
summary = "The button that opens the file dialog and shows the choice, and the path field that stands in, marked provisional, where no dialog exists."
summary_de = "Der Knopf, der den Datei-Dialog oeffnet und die Wahl zeigt, und das Pfadfeld, das als vorlaeufig gekennzeichnet einspringt, wo es keinen Dialog gibt."
parts = ["root", "row", "state", "problem", "provisional", "prompt", "title", "buttons"]
states = ["waiting", "failed"]

[block.file-preview]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape."
scope = "block"
widget = "FilePreview"
summary = "The preview of a file: title, facts, text, or the reason it is refused."
summary_de = "Die Vorschau einer Datei: Titel, Angaben, Text oder der Grund, warum sie abgelehnt wird."
parts = ["root", "head", "title", "fact", "label", "value", "mark", "marks", "note", "text", "refused"]
states = ["default", "busy"]

[block.lightbox]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (closest ARIA role: dialog)."
scope = "block"
widget = "Lightbox"
summary = "Pictures full-window with a bar, caption and count."
summary_de = "Bilder im ganzen Fenster mit Leiste, Bildunterschrift und Z\u00e4hler."
parts = ["root", "bar", "body", "stage", "caption", "count", "note"]
states = ["open", "busy"]

[block.message-composer]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape."
scope = "block"
widget = "MessageComposer"
summary = "The field where a message is written, with attached files and the send buttons."
summary_de = "Das Feld, in dem eine Nachricht geschrieben wird, mit Anh\u00e4ngen und Senden-Kn\u00f6pfen."
parts = ["root", "area", "buttons", "files", "file", "file-name", "notes", "note", "failed"]
states = ["busy", "disabled", "invalid"]

[block.message-list]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (closest ARIA role: log)."
scope = "block"
widget = "MessageList"
summary = "The messages of a conversation; who wrote it is the variant."
summary_de = "Die Nachrichten einer Unterhaltung; wer sie schrieb, ist die Variante."
parts = ["root", "msg", "head", "name", "meta", "body", "col", "delivery", "failure", "failure-text", "edge", "empty", "note", "notice", "reasoning", "refs", "tools"]
states = ["mine", "failed"]
variants = ["person", "software", "ai", "unknown"]

[block.participant]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (who takes part in a conversation)."
scope = "block"
widget = "Participant"
summary = "A chip that names a participant: person, software, AI or unknown."
summary_de = "Ein Chip, der einen Teilnehmenden nennt: Person, Software, KI oder unbekannt."
parts = ["root", "text"]
states = ["default"]
variants = ["person", "software", "ai", "unknown"]

[block.share-dialog]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (a dialog of one purpose)."
scope = "block"
widget = "ShareDialog"
summary = "The dialog that shows who may see something and lets the person choose."
summary_de = "Der Dialog, der zeigt, wer etwas sehen darf, und die Auswahl erlaubt."
parts = ["root", "title", "who", "list", "row", "mark", "name", "meta", "note", "perms", "pick", "buttons", "foot", "unknown"]
states = ["cursor", "selected", "checked"]

[block.person-picker]
accepts = []
renders = { basic = "reference", target = ["Person", "Profile", "Group", "Organization"], roles = ["input"] }
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (a dialog that chooses people from a source)."
scope = "block"
widget = "PersonPicker"
summary = "The dialog that searches a source of people and returns references to the chosen ones."
summary_de = "Der Dialog, der eine Personenquelle durchsucht und Verweise auf die Gewaehlten zurueckgibt."
parts = ["root", "head", "title", "list", "row", "mark", "pick", "who", "name", "meta", "note", "notice", "buttons", "foot"]
states = ["cursor", "selected", "checked"]

[block.sortable-list]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (closest ARIA role: listbox)."
scope = "block"
widget = "SortableList"
summary = "A list whose rows are moved by keys or drag."
summary_de = "Eine Liste, deren Zeilen per Tasten oder Ziehen verschoben werden."
parts = ["root", "lane", "row", "title", "note"]
states = ["cursor", "grabbed", "locked"]

[block.task-card]
accepts = []
naming = "own"
reason = "A card of a task on a board; the Open UI Card is the general frame, this one has task parts."
scope = "block"
widget = "TaskCard"
summary = "The card of one task: title, a line of facts, marks and tags. The card colour color-0 to color-6 is a variant; the meaning of a colour lives in the data (a label, a mark), never in the color alone."
summary_de = "Die Karte einer Aufgabe: Titel, Zeile mit Angaben, Markierungen und Labels. Die Kartenfarbe color-0 bis color-6 ist eine Variante; ihre Bedeutung steht in den Daten (Label, Markierung), nie allein in der Farbe."
parts = ["root", "title", "line", "mark", "tags", "tag"]
states = ["open", "selected", "hover"]
variants = ["color-0", "color-1", "color-2", "color-3", "color-4", "color-5", "color-6"]

[block.tool-call]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (a question of an agent about a tool it wants to use)."
scope = "block"
widget = "ToolCall"
summary = "What an agent wants to do, with its risk, and the buttons to allow or refuse."
summary_de = "Was ein Agent tun will, mit seinem Risiko, und die Kn\u00f6pfe zum Erlauben oder Ablehnen."
parts = ["list", "root", "head", "name", "kind", "state", "risk", "summary", "options", "details", "caption", "button", "chip-text", "code", "refused"]
states = ["question", "failed"]
variants = ["kind-reads", "kind-writes", "kind-runs", "kind-connected", "kind-unknown", "risk-ok", "risk-changes", "risk-high", "risk-unknown"]

[block.transfer-list]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape."
scope = "block"
widget = "TransferList"
summary = "Uploads and downloads with progress and the buttons by state."
summary_de = "Hoch- und Herunterladen mit Fortschritt und den Kn\u00f6pfen je Zustand."
parts = ["root", "row", "main", "name", "meta", "reason", "actions", "more", "empty"]
states = ["queued", "running", "done", "failed"]

[block.text-view]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a component of this shape (a document; table parts are the block `table`)."
scope = "block"
widget = "TextView"
summary = "A formatted document: headings, paragraphs, lists, quotes, code."
summary_de = "Ein formatiertes Dokument: \u00dcberschriften, Abs\u00e4tze, Listen, Zitate, Code."
parts = ["root", "block", "heading", "quote", "code", "codespan", "item", "marker", "rule", "run", "codelines"]
states = ["default"]

[block.board]
accepts = [
  { slot = "cards", kind = "records", required = true },
  { slot = "columns", kind = "grouping", within = "cards", required = true },
  { slot = "lanes", kind = "grouping", within = "cards", heads = ["rows@^1.0.0"] },
  { slot = "order", kind = "order", within = "cards", repeat = 2 },
  { slot = "card-title", kind = "value", basic = ["text"], role = "display", within = "cards", required = true },
  { slot = "card-facts", kind = "value", basic = ["any"], role = "compact", cardinality = "multiple", within = "cards", repeat = 4 },
  { slot = "card-lock", kind = "lock", within = "cards" },
  { slot = "activate", kind = "command", within = "cards" },
  { slot = "menu", kind = "command", within = "cards", repeat = 8 },
  { slot = "drop", kind = "command", within = "cards", args = ["column", "lane", "after", "before"] },
  { slot = "quick-add", kind = "command", within = "cards", args = ["title", "column", "lane"] },
]
forms = ["cards-in-columns@^1.0.0"]
naming = "own"
reason = "A board of columns of cards (kanban); no standard name."
scope = "block"
widget = "fs-components-kanban"
summary = "The board: a bar, the notice line and the columns of cards."
summary_de = "Das Brett: Leiste, Hinweiszeile und die Spalten mit Karten."
parts = ["root", "bar", "notice", "columns", "row", "main", "title-row", "title", "content", "drag", "drop-line", "ghost", "ghost-reason", "line", "line-text"]
states = ["busy", "empty", "refused", "blocked", "disabled", "unsupported"]

[block.board-column]
accepts = []
naming = "own"
reason = "One column of a board with its head and cards; the user named it as a block of its own."
scope = "block"
summary = "One column of a board: head with name and count, the cards, an add row."
summary_de = "Eine Spalte eines Bretts: Kopf mit Name und Zahl, die Karten, eine Zeile zum Hinzuf\u00fcgen."
parts = ["root", "head", "name", "count", "cards", "add", "add-text", "entry", "wip", "wip-text", "wip-symbol", "hidden", "head-menu", "empty", "foot", "entry-notice"]
states = ["hover", "selected", "over-limit", "disabled", "unsupported"]
variants = ["drop-target"]

[block.timeline]
accepts = []
forms = ["bars-in-time@^1.0.0"]
naming = "own"
reason = "A time axis with items and arrows between them; no standard name."
scope = "block"
widget = "Timeline"
summary = "Items on a time axis with the today line and dependency arrows."
summary_de = "Eintr\u00e4ge auf einer Zeitachse mit Heute-Linie und Abh\u00e4ngigkeitspfeilen."
parts = ["root", "toolbar", "axis", "body", "scroll", "arrows", "today", "today-arrow", "today-edge", "today-row"]
states = ["default", "busy"]

[block.map]
accepts = []
naming = "own"
reason = "A map with tiles and controls; no ARIA role or Open UI component."
scope = "block"
widget = "fs-components-map"
summary = "The map: attribution line and the zoom controls (tiles are drawn, not styled)."
summary_de = "Die Karte: Quellenzeile und die Zoom-Bedienung (Kacheln werden gezeichnet, nicht gestaltet)."
parts = ["attribution", "controls", "control"]
states = ["default", "busy", "invalid"]

[block.board-card]
accepts = []
naming = "own"
reason = "A card of the board workbench: title and one grey line of facts, no badges; the Open UI Card is the general frame."
scope = "block"
summary = "A card of the board workbench: the title and one quiet line; marks for the one under the keyboard, held, carried and locked. The card colour color-0 to color-6 is a variant; its meaning lives in the data, never in the color alone."
summary_de = "Eine Karte der Board-Werkbank: Titel und eine ruhige Zeile; Markierung f\u00fcr die unter der Tastatur, gehaltene, getragene und gesperrte. Die Kartenfarbe color-0 bis color-6 ist eine Variante; ihre Bedeutung steht in den Daten, nie allein in der Farbe."
parts = ["root", "title", "meta"]
states = ["cursor", "held", "carried", "locked"]
variants = ["color-0", "color-1", "color-2", "color-3", "color-4", "color-5", "color-6"]

[block.board-detail]
accepts = []
naming = "own"
reason = "The frame at the side of the board that shows one card (path, title, properties, main action); no standard name."
scope = "block"
summary = "The frame at the side that shows one card: path, title, properties as name and value, the main action."
summary_de = "Der Rahmen an der Seite, der eine Karte zeigt: Pfad, Titel, Eigenschaften als Name und Wert, die Hauptaktion."
parts = ["root", "top", "path", "close", "title", "prop", "name", "value", "unset", "actions"]
states = ["default", "disabled", "unsupported"]

[block.column-table]
accepts = []
naming = "own"
reason = "The table of a board's columns (handle, name, status, stage, limit, cards, row buttons); the Open UI Table is the general one, this one edits."
scope = "block"
widget = "column_table"
summary = "The table of columns: a handle to drag, name, status, stage, limit and cards per row, row buttons, add, and a Save that says why it is blocked."
summary_de = "Die Spaltentabelle: Griff zum Ziehen, Name, Status, Stufe, Limit und Karten je Zeile, Zeilenknoepfe, Hinzufuegen und ein Speichern, das sagt, warum es gesperrt ist."
parts = ["root", "head", "head-cell", "row", "handle", "cell", "status", "rowbtn", "problem", "add", "foot", "reason"]
states = ["default"]

[block.swatch]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md); neither ARIA nor Open UI has a colour chip (Open UI has no colour picker component). The colours are the palette color-0 to color-6 of avatar, so the theme owns the colour."
scope = "block"
summary = "One colour chip of a palette: the colour, a mark when chosen, an optional label. The chip is the variant color-0 to color-6; the name of the colour (the label) is what carries the meaning, never the colour alone."
summary_de = "Ein Farbfeld einer Palette: die Farbe, eine Markierung wenn gewählt, optional eine Beschriftung. Das Feld ist die Variante color-0 bis color-6; den Sinn trägt der Name der Farbe (die Beschriftung), nie die Farbe allein."
parts = ["root", "mark", "label"]
states = ["default", "selected", "hover", "focus", "disabled"]
variants = ["color-0", "color-1", "color-2", "color-3", "color-4", "color-5", "color-6"]

[block.swatch-grid]
accepts = []
naming = "own"
reason = "Our own widget (DESIGN.md): WAI-ARIA radiogroup behaviour (one chosen, arrow keys move the choice) over a grid of swatches; ARIA has no colour picker role. As an input of a choice it is used through field-choice (the options are the swatches)."
scope = "block"
summary = "A grid of swatches of which one is chosen (radiogroup: arrow keys move, Space or Enter chooses); the input for a choice of a colour."
summary_de = "Ein Raster von Farbfeldern, von denen eines gewählt wird (radiogroup: Pfeiltasten bewegen, Leertaste oder Enter wählt); die Eingabe für die Wahl einer Farbe."
parts = ["root", "swatch", "label"]
states = ["focus", "disabled", "readonly", "invalid", "required"]

[block.code-editor]
accepts = []
naming = "own"
reason = "ARIA gives only the multiline textbox (role of the part `text`); neither ARIA nor Open UI has an editor with line numbers, overview map and preview."
scope = "general"
widget = "CodeEditor"
forms = ["single-record@^1.1.0"]
summary = "Source text (Markdown, TOML, code) with line numbers, colours by language, an overview map and an optional live preview."
summary_de = "Quelltext (Markdown, TOML, Code) mit Zeilennummern, Farben je Sprache, Übersichtskarte und wahlweise Vorschau."
parts = ["root", "gutter", "line-number", "fold", "text", "active-line", "selection", "caret", "guide", "diagnostic", "find", "minimap", "minimap-slider", "bar", "preview", "language"]
states = ["default", "focus", "readonly", "editing", "busy", "invalid", "disabled"]
variants = ["plain", "split"]
