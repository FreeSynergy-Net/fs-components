[package]
name = "fs-components-editor"
description = "The contract of the editor building blocks of FreeSynergy (Strategy): model in, change operations out; std only; the feature `syntect` adds the colours of source text (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The language adapter `SyntectLanguage` (syntect + two-face, pure Rust); not part of the std-only core.
syntect = ["dep:syntect", "dep:two-face"]

[dependencies]
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }

[dev-dependencies]
# The standard as a cross-check of the saved form (tests only): what a `CommonMark` reader makes of it.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
