[package]
name = "fs-components-render"
description = "FreeSynergy rendering base: theme bundle, fonts and drawing an element to a PNG without a window; used by workbenches and the app shell, knows neither"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-components-styles = { path = "../fs-components-styles", version = "0.1.0" }
# The settings `fs.look.style` and `fs.look.scheme` drive the style of a running window (`StyleFollows`).
fs-settings = { path = "../fs-settings", version = "0.1.0" }
blinc_app.workspace = true
blinc_cn.workspace = true
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_theme.workspace = true
blinc_noto_emoji.workspace = true
# Which mono face is installed (the same fontdb that Blinc reads the system fonts with).
fontdb = "0.22"
# The advance of `i` and `M` of a face (the monospace check of `installed_mono_face`); same version as the one `fontdb` reads with.
ttf-parser = "0.24"
wgpu = "26"
image = { version = "0.25", default-features = false, features = ["png"] }
