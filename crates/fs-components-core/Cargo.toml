[package]
name = "fs-components-core"
description = "FreeSynergy widgets, the core (cut out of fs-components-widgets): keys, live regions, focus, roving, icons, states, text model, landmark, drafts. Everything else of the widgets builds on it; fs-components-widgets re-exports it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_cn.workspace = true
blinc_theme.workspace = true
fs-components-styles = { path = "../fs-components-styles", version = "0.1.0" }
fs-components-words = { path = "../fs-components-words", version = "0.1.0" }
fs-components-mf2 = { path = "../fs-components-mf2", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
proptest = "1"
