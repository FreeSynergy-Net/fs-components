[package]
name = "fs-components-widgets"
description = "FreeSynergy widgets (layer 2): text-view over a neutral block model, tree-view; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# See `fs-components-primitives`: a read-only way for a test to ask what is typed into the text fields. Never in a release.
test-access = ["fs-components-primitives/test-access"]

[dependencies]
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_cn.workspace = true
blinc_theme.workspace = true
blinc_noto_emoji.workspace = true
fontdb = "0.22"
ttf-parser = "0.24"
fs-components-commands = { path = "../fs-components-commands", version = "0.1.0" }
fs-components-primitives = { path = "../fs-components-primitives", version = "0.1.0" }
fs-components-core = { path = "../fs-components-core", version = "0.1.0" }
fs-components-lists = { path = "../fs-components-lists", version = "0.1.0" }
fs-components-measures ={ path = "../fs-components-measures", version = "0.1.0" }
fs-components-overlays ={ path = "../fs-components-overlays", version = "0.1.0" }
fs-components-styles = { path = "../fs-components-styles", version = "0.1.0" }
fs-components-words = { path = "../fs-components-words", version = "0.1.0" }
fs-components-mf2 = { path = "../fs-components-mf2", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# RFC 3339 reading of `bars-in-time` (the wall time of the given offset; no zone database, no clock)
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# RFC 8984 `color` (a CSS colour value) of `bars-in-time@1.1.0`: read by the crate, not by a parser of our own
csscolorparser = "0.7"

[dev-dependencies]
fs-components-render = { path = "../fs-components-render", version = "0.1.0" }
blinc_app.workspace = true
wgpu = "26"
blinc_animation.workspace = true
