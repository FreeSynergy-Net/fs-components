[package]
name = "fs-components-styles"
description = "FreeSynergy styles: tokens, effects and an icon set per style (Admin, Simple, Apple, Windows); no Blinc, plain data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The one reader of CSS colour text (RFC 8984 `color`); names and functions, no serde/rgb/cint.
csscolorparser = { version = "0.9", default-features = false, features = ["named-colors"] }
