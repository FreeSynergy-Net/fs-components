[package]
name = "fs-components"
description = "The one entry point of fs-components for programs: re-exports Blinc (pinned once, at one tag) so a program needs no blinc_* dependency and no [patch] line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blinc_animation.workspace = true
blinc_app.workspace = true
blinc_cn.workspace = true
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_noto_emoji.workspace = true
blinc_theme.workspace = true

# The views: which widget of the block contract is drawn by which component (`views()`). The host asks the catalog for the widget of a
# block and this table for the component; a program that only wants Blinc leaves the feature off and gets no component crate.
[features]
default = []
# The colours of the code editor by media type; off = plain text there.
syntect = ["fs-components-workbenches?/syntect"]
views = [
    "dep:fs-components-core",
    "dep:fs-components-kanban",
    "fs-components-kanban/form",
    "dep:fs-components-lists",
    "dep:fs-components-widgets",
    "dep:fs-components-workbenches",
]

[dependencies.fs-components-core]
path = "../fs-components-core"
version = "0.1.0"
optional = true

[dependencies.fs-components-kanban]
path = "../fs-components-kanban"
version = "0.1.0"
default-features = false
optional = true

[dependencies.fs-components-lists]
path = "../fs-components-lists"
version = "0.1.0"
optional = true

[dependencies.fs-components-widgets]
path = "../fs-components-widgets"
version = "0.1.0"
optional = true

[dependencies.fs-components-workbenches]
path = "../fs-components-workbenches"
version = "0.1.0"
optional = true

[dev-dependencies]
fs-components-catalog = { path = "../fs-components-catalog", version = "0.1.0" }
