[package]
name = "fs-components-catalog"
description = "What a FreeSynergy building block ACCEPTS (block contract 0.4, key `accepts`): the slots of every block (value, records, grouping, order, command, lock), read from the contract files, and the check of a binding against a block, a provider's type catalog and its record shapes. No window, no Blinc."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-types.workspace = true
fs-records.workspace = true
# TOML 1.0 reader, the same version as fs-setting (0.8, already in the lock through fs-tasks); parsing only.
toml = { version = "0.8", default-features = false, features = ["parse"] }
