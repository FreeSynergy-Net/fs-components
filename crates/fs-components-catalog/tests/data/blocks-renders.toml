# TEST DATA (block contract 0.4, key `renders`): one block for every basic type this reader knows, all four roles.
# `person-picker` draws a reference to a person (and the like) and wins over `field-reference` for those targets.

[block.field-text]
accepts = []
renders = { basic = "text", roles = ["input", "display", "compact", "cell"] }

[block.field-multiline]
accepts = []
renders = { basic = "multilineText", roles = ["input", "display", "compact", "cell"] }

[block.field-email]
accepts = []
renders = { basic = "email", roles = ["input", "display", "compact", "cell"] }

