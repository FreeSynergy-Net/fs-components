[package]
name = "fs-settings"
description = "FreeSynergy settings as an interface of their own: typed, declared per building block, layered (default, instance, system, person, program), locks, live changes; plus an optional conformance suite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The suite `settings` (rules + bench + mutants). Never in `default`: fs-conformance stays out of the normal graph (review A4).
conformance = ["dep:fs-conformance", "dep:async-trait"]
# The old file store (`XdgFiles`, TOML). Not in `default`; the database replaces it, and it is removed in the lift once the
# program fs-settings has its own round-trip test (import/export is the program's job, not this library's).
xdg-files = ["dep:toml"]

[dependencies]
fs-types.workspace = true
# TOML 1.0 files, only for the old file store (feature `xdg-files`).
toml = { version = "0.8", optional = true }
fs-conformance = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
# the build-time check of the text files (`check_pairs`), as every crate with texts runs it
fs-components-mf2 = { path = "../fs-components-mf2" }
