[package]
name = "fs-components-workbenches"
description = "FreeSynergy workbenches (layer 3): the document reader, open work surface over a data source it knows nothing about; Blinc stays behind this API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-components-widgets = { path = "../fs-components-widgets", version = "0.1.0" }
# The board workbench draws and moves the cards of the board model (`Column`, `Card`) of the kanban crate.
fs-components-kanban = { path = "../fs-components-kanban", version = "0.1.0" }
fs-components-primitives = { path = "../fs-components-primitives", version = "0.1.0" }
fs-components-commands = { path = "../fs-components-commands", version = "0.1.0" }
blinc_app.workspace = true
blinc_cn.workspace = true
blinc_core.workspace = true
blinc_layout.workspace = true
blinc_theme.workspace = true
fs-components-render = { path = "../fs-components-render", version = "0.1.0" }
fs-components-editor = { path = "../fs-components-editor", version = "0.1.0" }
fs-components-mf2 = { path = "../fs-components-mf2", version = "0.1.0" }
fs-components-words = { path = "../fs-components-words", version = "0.1.0" }
fs-components-fields = { path = "../fs-components-fields", version = "0.1.0" }
fs-components-core = { path = "../fs-components-core", version = "0.1.0" }
fs-components-styles = { path = "../fs-components-styles", version = "0.1.0" }

[dev-dependencies]
# Only for the size of the smallest window: the app crate knows no workbench.
fs-components-app = { path = "../fs-components-app", version = "0.1.0" }
wgpu = "26"
image = { version = "0.25", default-features = false, features = ["png"] }

# The colours of the code editor by media type (syntect, pure Rust); without the feature the text is plain.
[features]
default = []
syntect = ["fs-components-editor/syntect"]
