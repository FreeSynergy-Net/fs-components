[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Blinc: the one place. Every blinc_* crate comes from the same tag of our fork, so a program that depends on
# fs-components gets it transitively (Cargo applies [patch] only at the top of a build, so none is used here).
[workspace.dependencies]
blinc_animation = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }
blinc_app = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }
blinc_cn = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }
blinc_core = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }
blinc_layout = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }
blinc_noto_emoji = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }
blinc_theme = { git = "https://github.com/FreeSynergy/Blinc", tag = "fs-blinc-3.2", version = "0.6.0" }

# fs-types: the basic types and the type description, from its own repository (ADR 0093). The only source of the name in the tree; the
# values (e-mail, phone, `ValueProblem`) and the Cap'n Proto code of the types are in it, so nothing here needs fs-interfaces.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6", version = "0.0.5" }
# fs-records and fs-conformance are crates of the fs-types repository: the same rev, so the lock holds ONE source.
fs-records = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6", version = "0.0.5" }
fs-conformance = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6", version = "0.0.5" }

# semver reads every version and need of the catalog (one rule, V-3): same crate and version as fs-types.
semver = "1.0.28"

# Colours of source text (feature `syntect` of fs-components-editor): pure Rust regex (fancy-regex), no onig, no C. two-face brings
# the syntaxes TOML, Markdown, Rust and JSON; with `fancy` it leaves out four others (ARM Assembly, JavaScript Babel, PowerShell, Salt),
# none of ours. Only `parsing`, `regex-fancy` and `dump-load` of syntect and `syntect-fancy` of two-face (not `default-fancy`): no yaml-rust (RUSTSEC-2024-0320), plist,
# quick-xml, time. `bincode` (RUSTSEC-2025-0141, unmaintained) stays: `dump-load` needs it, a matter for syntect upstream. The regex feature of two-face is a must (its default is `syntect-onig`).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[profile.dev.package."*"]
opt-level = 2

# Quick test builds (`--cargo-profile fast`): like dev, but without debug info (smaller, faster to link).
[profile.fast]
inherits = "dev"
debug = 0
